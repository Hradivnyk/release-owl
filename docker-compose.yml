services:
  app:
    build: .
    # Both `build` and `image` are set on purpose: locally `up --build` builds and
    # tags the image, while in production the CI-built image is pulled from GHCR.
    # IMAGE_PREFIX/IMAGE_TAG come from .env on the server (see README → Deployment).
    image: ${IMAGE_PREFIX:-release-owl}/app:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      # Notifier transport: broker (default) | rest | grpc
      NOTIFIER: ${NOTIFIER:-broker}
      NOTIFICATION_GRPC_URL: notification:50051
      NOTIFICATION_REST_URL: http://notification:4000
    depends_on:
      db:
        condition: service_healthy # wait for DB to be ready
      rabbitmq:
        condition: service_healthy # wait for the broker before publishing
    labels:
      co.elastic.logs/enabled: 'true'
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    image: ${IMAGE_PREFIX:-release-owl}/notification:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      DATABASE_URL: postgresql://${NOTIFICATION_POSTGRES_USER:-postgres}:${NOTIFICATION_POSTGRES_PASSWORD:-postgres}@notification-db:5432/${NOTIFICATION_POSTGRES_DB:-notification_db}
      HEALTH_PORT: 3002
      GRPC_PORT: 50051
      REST_PORT: 4000
    # gRPC (50051) and REST (4000) are reachable inside the compose network by
    # service name; they are not published to the host. To run ghz/autocannon
    # benchmarks locally, publish them via docker-compose.override.yml.
    depends_on:
      rabbitmq:
        condition: service_healthy # wait for the broker before consuming
      notification-db:
        condition: service_healthy # wait for DB before running migrations
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:$${HEALTH_PORT}/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      co.elastic.logs/enabled: 'true'
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification_db}
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${NOTIFICATION_POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [production]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Second site served by this Caddy: the ustriy-system stack, which joins
      # the shared `edge` network and exposes its nginx on port 8080.
      USTRIY_DOMAIN: ${USTRIY_DOMAIN:-ustriy.localhost}
      GRAFANA_USER: ${GRAFANA_USER:-admin}
      GRAFANA_HASHED_PASSWORD: ${GRAFANA_HASHED_PASSWORD}
      KIBANA_USER: ${KIBANA_USER:-kibana}
      KIBANA_HASHED_PASSWORD: ${KIBANA_HASHED_PASSWORD}
    depends_on:
      - app
    networks:
      - default # reach app, grafana, kibana
      - edge # reach the ustriy-system stack
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: [observability]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 256m heap keeps the whole ELK profile under ~2 GB so it can be started
      # on demand on a small VPS. Raise to 512m if you index heavier workloads.
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health | grep -v ''"status":"red"''',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: [observability]
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - XPACK_OBSERVABILITYAIASSISTANT_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTEDSAVEDOBJECTS_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:5601/kibana/api/status | grep -q ''"level":"available"''',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  es-init:
    image: curlimages/curl:8.7.1
    profiles: [observability]
    volumes:
      - ./elasticsearch/init-template.sh:/etc/elasticsearch/init-template.sh:ro
      - ./elasticsearch/index-template.json:/etc/elasticsearch/index-template.json:ro
      - ./kibana/saved_objects.ndjson:/etc/kibana/saved_objects.ndjson:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    entrypoint: ['sh', '/etc/elasticsearch/init-template.sh']
    restart: 'no'

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    profiles: [observability]
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully # apply index template before shipping logs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3000/grafana/api/health | grep -q ok',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.12.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - app
    restart: unless-stopped

# Shared with the ustriy-system stack so a single Caddy can terminate TLS for
# both projects on one host. Create it once: docker network create edge
# Only the `production` profile attaches to it.
networks:
  edge:
    external: true

volumes:
  postgres_data:
  notification_postgres_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
  es_data:
  prometheus_data:
  grafana_data:
