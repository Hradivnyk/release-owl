name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Caches ~/.npm between runs; npm ci then restores packages from cache
          # instead of downloading them, making each job fast without sharing node_modules.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run typecheck
        run: npm run typecheck

      # tsc --noEmit skips emit errors (outDir, declarationMap, etc.)
      # that only surface during an actual compilation run.
      - name: Build
        run: npm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: cp .env.test.example .env.test

      - name: Run integration tests
        # Spins up postgres via docker-compose.test.yml, runs jest, then tears it down.
        run: npm run test:integration:ci

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Spins up the full app stack via docker-compose.yml + e2e override, then runs Playwright.
        # PLAYWRIGHT_SKIP_WEBSERVER: app runs in Docker, Playwright should not start its own server.
        run: npm run test:e2e:ci
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test-unit, test-integration, test-e2e]
    # Deploy only on a real push to main (i.e. after a PR is merged),
    # not on pull_request events which also target main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_WORK_DIR }}
            git pull origin main
            docker compose --profile production up -d --build
            docker image prune -f
